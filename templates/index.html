<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .approved {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .not-approved {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Loan Prediction System</h1>
        <form id="predictionForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="married" class="form-label">Married</label>
                    <select class="form-select" id="married" name="married" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="dependents" class="form-label">Dependents</label>
                    <select class="form-select" id="dependents" name="dependents" required>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3+">3+</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="education" class="form-label">Education</label>
                    <select class="form-select" id="education" name="education" required>
                        <option value="Graduate">Graduate</option>
                        <option value="Not Graduate">Not Graduate</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="self_employed" class="form-label">Self Employed</label>
                    <select class="form-select" id="self_employed" name="self_employed" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="property_area" class="form-label">Property Area</label>
                    <select class="form-select" id="property_area" name="property_area" required>
                        <option value="Urban">Urban</option>
                        <option value="Rural">Rural</option>
                        <option value="Semiurban">Semiurban</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="applicant_income" class="form-label">Applicant Income</label>
                    <input type="number" class="form-control" id="applicant_income" name="applicant_income" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="coapplicant_income" class="form-label">Coapplicant Income</label>
                    <input type="number" class="form-control" id="coapplicant_income" name="coapplicant_income" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="loan_amount" class="form-label">Loan Amount</label>
                    <input type="number" class="form-control" id="loan_amount" name="loan_amount" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="loan_term" class="form-label">Loan Term (months)</label>
                    <input type="number" class="form-control" id="loan_term" name="loan_term" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="credit_history" class="form-label">Credit History</label>
                <select class="form-select" id="credit_history" name="credit_history" required>
                    <option value="1">Good</option>
                    <option value="0">Bad</option>
                </select>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Predict</button>
            </div>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultDiv.className = 'result not-approved';
                    resultDiv.textContent = `Error: ${data.error}`;
                } else {
                    resultDiv.className = `result ${data.prediction === 'Approved' ? 'approved' : 'not-approved'}`;
                    resultDiv.textContent = `Loan ${data.prediction} (Confidence: ${(data.probability * 100).toFixed(2)}%)`;
                }
                
                resultDiv.style.display = 'block';
            } catch (error) {
                resultDiv.className = 'result not-approved';
                resultDiv.textContent = 'Error: Could not get prediction';
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
